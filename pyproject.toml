[build-system]
requires = ["scikit-build-core>=0.8"]
build-backend = "scikit_build_core.build"

[project]
name = "qubitserf"
version = "0.1.0"
description = "Quantum & classical code toolkit: exact code distance (distfind) + automorphism groups (codeaut), with C++/CUDA/Metal backends."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Serban Cercelescu" }]
keywords = [
    "quantum error correction", "code distance", "minimum distance",
    "Brouwer-Zimmermann", "connected cluster", "CSS codes", "LDPC",
    "automorphism-group", "Leon", "nauty", "Traces", "coding-theory",
    "GPU", "Metal", "CUDA",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
# codeaut uses `sympy` as an OPTIONAL accelerator for large-group backtracking intersection
# (the Leon dual-trick path); it still works without it.
fast = ["sympy>=1.9"]
bench = ["codedistance"]
docs = ["mkdocs", "mkdocs-material"]
dev = ["pytest>=7", "scipy", "sympy>=1.9"]

[project.urls]
Homepage = "https://github.com/quantinuum/qubitserf"
Repository = "https://github.com/quantinuum/qubitserf"

# ---------------------------------------------------------------------------------------
# Native backends: CMake builds ONE shared library (libqubitserf -> qubitserf/_lib) exposing
# both flat extern "C" ABIs over a shared enumeration core, loaded via ctypes (no pybind11 /
# Cython): distfind_* (include/distfind/capi.h) and codeaut_bz_*/qaut_* (include/codeaut/capi.h).
#
# codeaut's CSS / classical colored-graph solves additionally use the system nauty/Traces
# (`dreadnaut`); install with `brew install nauty` / `apt install nauty` / conda-forge. The
# distance engines and the Leon/BZ engines need no system dependency.
# ---------------------------------------------------------------------------------------
[tool.scikit-build]
minimum-version = "0.8"
wheel.packages = ["python/qubitserf"]
cmake.version = ">=3.20"
sdist.include = ["src", "include", "CMakeLists.txt", "LICENSE", "README.md"]

[tool.scikit-build.cmake.define]
QUBITSERF_TESTS = "OFF"
QUBITSERF_CLI = "OFF"
QUBITSERF_METAL = "ON"
QUBITSERF_CUDA = "ON"

[tool.pytest.ini_options]
testpaths = ["tests"]
